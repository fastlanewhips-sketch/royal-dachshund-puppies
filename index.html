
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a30">
  <meta name="description" content="Meet the puppies at Royal Dachshund Puppies. View puppy profiles, learn about responsible puppy ownership, and contact us for availability.">
  <title>Royal Dachshund Puppies | Find Your Companion</title>

  <style>
    :root {
      --navy: #101a30;
      --navy-light: #192743;
      --gold: #d9b568;
      --gold-light: #f3dfa8;
      --cream: #faf8f2;
      --white: #ffffff;
      --text: #222b39;
      --muted: #6b7280;
      --border: #e9e3d7;
      --shadow: 0 8px 28px rgba(16, 26, 48, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin-inline: auto;
    }

    .top-strip {
      background: var(--navy);
      color: var(--gold-light);
      text-align: center;
      font-size: 11px;
      letter-spacing: 1.1px;
      padding: 8px 12px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(16, 26, 48, .98);
      border-bottom: 1px solid rgba(217,181,104,.3);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-emblem {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold-light);
      font-size: 24px;
    }

    .brand-name {
      color: white;
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.25;
    }

    .brand-subtitle {
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 23px;
      color: white;
      font-size: 13px;
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    .nav-cta {
      background: var(--gold);
      color: var(--navy) !important;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
    }

    .hero {
      background:
        radial-gradient(ellipse at 80% 20%, rgba(217,181,104,.14), transparent 42%),
        linear-gradient(135deg, #101a30, #1b2b49);
      color: white;
      padding: 65px 0 72px;
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      gap: 42px;
    }

    .eyebrow {
      display: inline-block;
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.2;
    }

    h1 {
      font-size: clamp(36px, 5vw, 57px);
      letter-spacing: -.8px;
      margin-bottom: 20px;
    }

    h1 span {
      color: var(--gold-light);
    }

    .hero-copy {
      max-width: 480px;
      color: #d8deea;
      font-size: 15px;
      margin-bottom: 27px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 47px;
      padding: 12px 19px;
      border: 1px solid transparent;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      transition: transform .2s, background .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-gold {
      background: var(--gold);
      color: var(--navy);
    }

    .btn-outline {
      border-color: rgba(255,255,255,.45);
      color: white;
    }

    .hero-visual {
      position: relative;
      max-width: 440px;
      width: 100%;
      justify-self: end;
    }

    .hero-frame {
      position: relative;
      border: 1px solid rgba(217,181,104,.7);
      padding: 9px;
      border-radius: 170px 170px 16px 16px;
      background: rgba(255,255,255,.04);
    }

    .hero-frame-inner {
      min-height: 280px;
      border-radius: 160px 160px 10px 10px;
      background: linear-gradient(150deg, #253653, #111a2c);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }

    .hero-dog {
      font-size: clamp(85px, 13vw, 135px);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .hero-visual-title {
      color: var(--gold-light);
      font-family: Georgia, serif;
      font-size: 23px;
    }

    .hero-visual-copy {
      color: #d8deea;
      font-size: 12px;
      margin-top: 7px;
    }

    .trust-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 34px;
      max-width: 460px;
    }

    .trust-item {
      border-left: 2px solid var(--gold);
      padding-left: 11px;
    }

    .trust-item strong {
      display: block;
      font-size: 15px;
      color: white;
    }

    .trust-item span {
      font-size: 10px;
      color: #cbd2df;
    }

    .section {
      padding: 67px 0;
    }

    .section-heading {
      text-align: center;
      max-width: 630px;
      margin: 0 auto 31px;
    }

    .section-heading .eyebrow {
      margin-bottom: 9px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: clamp(29px, 4vw, 39px);
      margin-bottom: 12px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
    }

    .features {
      background: white;
      border-bottom: 1px solid var(--border);
      border-top: 1px solid var(--border);
      padding: 25px 0;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .feature {
      text-align: center;
      padding: 5px;
    }

    .feature-icon {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .feature h3 {
      color: var(--navy);
      font-size: 16px;
      margin-bottom: 4px;
    }

    .feature p {
      color: var(--muted);
      font-size: 12px;
    }

    .catalog {
      background: var(--cream);
    }

    .catalog-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .search-box {
      width: 100%;
      max-width: 390px;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(217,181,104,.15);
    }

    .results-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .puppy-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .puppy-card {
      min-width: 0;
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      transition: transform .2s, box-shadow .2s;
    }

    .puppy-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 35px rgba(16,26,48,.12);
    }

    .puppy-photo {
      position: relative;
      height: 245px;
      overflow: hidden;
      background: linear-gradient(135deg, #e8dfcd, #f7f3eb);
    }

    .puppy-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform .35s;
    }

    .puppy-photo img:hover {
      transform: scale(1.04);
    }

    .photo-placeholder {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--navy);
      gap: 6px;
    }

    .photo-placeholder span {
      font-size: 64px;
    }

    .photo-placeholder small {
      color: #756a56;
      font-size: 11px;
    }

    .puppy-photo img.broken {
      display: none;
    }

    .puppy-photo img.broken + .photo-placeholder {
      display: flex;
    }

    .photo-label {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 1;
      padding: 5px 10px;
      border-radius: 5px;
      background: var(--navy);
      color: var(--gold-light);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .puppy-content {
      padding: 19px;
    }

    .puppy-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }

    .puppy-title {
      font-size: 21px;
      color: var(--navy);
      overflow-wrap: anywhere;
    }

    .puppy-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .price {
      color: #8b682b;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .puppy-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 13px;
    }

    .meta-chip {
      background: #f5f1e8;
      border-radius: 5px;
      color: #5f523b;
      padding: 5px 8px;
      font-size: 10px;
    }

    .puppy-description {
      color: #555e6b;
      font-size: 12px;
      line-height: 1.8;
      margin-bottom: 17px;
      overflow-wrap: anywhere;
    }

    .puppy-card .btn {
      width: 100%;
      min-height: 43px;
      font-size: 12px;
    }

    .no-results {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 15px;
      color: var(--muted);
    }

    .about {
      background: white;
      border-block: 1px solid var(--border);
    }

    .about-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 44px;
      align-items: center;
    }

    .about-art {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      background: var(--navy);
      border-radius: 12px;
      border: 5px solid #f0e5ce;
      outline: 1px solid var(--gold);
    }

    .about-art .crown {
      font-size: 35px;
      margin-bottom: 9px;
    }

    .about-art h3 {
      color: var(--gold-light);
      font-size: 27px;
    }

    .about-art p {
      margin-top: 12px;
      color: #d8deea;
      font-size: 13px;
    }

    .about-copy h2 {
      color: var(--navy);
      font-size: clamp(29px, 4vw, 37px);
      margin-bottom: 15px;
    }

    .about-copy > p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 17px;
    }

    .about-list {
      list-style: none;
      display: grid;
      gap: 11px;
      margin: 20px 0 24px;
    }

    .about-list li {
      display: flex;
      gap: 10px;
      font-size: 13px;
      align-items: flex-start;
    }

    .about-list li span {
      color: #9a742f;
      font-weight: bold;
    }

    .contact {
      background: linear-gradient(135deg, var(--navy), #203451);
      color: white;
      padding: 65px 0;
    }

    .contact-inner {
      max-width: 700px;
      text-align: center;
      margin: auto;
    }

    .contact h2 {
      color: white;
      font-size: clamp(30px, 4vw, 42px);
      margin-bottom: 15px;
    }

    .contact p {
      color: #d4dce8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .contact-details {
      display: grid;
      gap: 12px;
      margin: 25px auto;
      max-width: 470px;
    }

    .contact-item {
      border: 1px solid rgba(217,181,104,.35);
      border-radius: 8px;
      padding: 13px;
      overflow-wrap: anywhere;
      color: var(--gold-light);
      font-size: 13px;
    }

    .contact-item strong {
      display: block;
      color: white;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .contact-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer {
      background: #0b1322;
      color: #b8c0ce;
      padding: 26px 0;
      text-align: center;
      font-size: 11px;
    }

    footer .footer-brand {
      font-family: Georgia, serif;
      color: var(--gold-light);
      font-size: 17px;
      margin-bottom: 7px;
    }

    footer p + p {
      margin-top: 6px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5,10,20,.93);
      padding: 20px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 6px;
    }

    .lightbox-close {
      position: absolute;
      top: 15px;
      right: 18px;
      width: 44px;
      height: 44px;
      border: 1px solid #ffffff55;
      border-radius: 50%;
      background: #17243a;
      color: white;
      font-size: 25px;
    }

    .back-top {
      display: inline-block;
      margin-top: 10px;
      color: var(--gold-light);
    }

    @media (max-width: 850px) {
      .hero {
        padding: 48px 0 53px;
      }

      .hero-grid {
        gap: 24px;
      }

      .hero-frame-inner {
        min-height: 260px;
      }

      .puppy-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .puppy-photo {
        height: 220px;
      }

      .about-grid {
        gap: 28px;
      }

      .nav-links {
        gap: 14px;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 28px);
      }

      .top-strip {
        font-size: 9px;
        letter-spacing: .8px;
        padding: 7px 5px;
      }

      .navbar {
        min-height: 67px;
        gap: 8px;
      }

      .brand {
        gap: 7px;
      }

      .brand-emblem {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
        font-size: 20px;
      }

      .brand-name {
        font-size: 14px;
      }

      .brand-subtitle {
        font-size: 8px;

      }

      .nav-links {
        gap: 0;
      }

      .nav-links a:not(.nav-cta) {
        display: none;
      }

        padding: 9px 10px;
        font-size: 11px;
      }

        padding: 37px 0 38px;
      }

        grid-template-columns: 1fr;
        gap: 27px;
      }

      }

      }

        flex: 1;

      }

      }

      .puppy-subtitle {
        font-size: 10px;
      }

      .price {
        font-size: 16px;

      .puppy-meta {
        gap: 5px;

      }

      .meta-chip {
        padding: 4px 6px;

      .about-art {

        font-size: 24px;
      }

      .about-copy h2 {
        font-size: 29px;
      }

      .about-copy > p {
        font-size: 13px;
      }

      .about-list li {
        font-size: 12px;
      }

      .contact {
        padding: 45px 0;
      }

      .contact h2 {
        font-size: 31px;
      }

      .contact p {
        font-size: 12px;
      }

      .contact-item {
        font-size: 12px;
      }

      .contact-actions .btn {
        width: 100%;
      }
    }

    @media (max-width: 350px) {
      .container {
        width: calc(100% - 20px);
      }

      .brand-name {
        font-size: 12px;
      }

      .brand-subtitle {
        font-size: 7px;
      }

      .nav-cta {
        padding: 8px;
        font-size: 10px;
      }

      .puppy-grid {
        gap: 8px;
      }

      .puppy-content {
        padding: 9px;
      }

      .puppy-photo {
        height: 135px;
      }

      .puppy-title {
        font-size: 15px;
      }

      .puppy-description {
        font-size: 10px;
      }

    @media (prefers-reduced-motion: reduce) {

<script>
const puppies = [
["Prince","Male","👑","the_hotdogs_cl_20261012_120906_278.jpg","Meet Prince, a charming little Dachshund with a lovable personality and a heart full of affection. 🐾 He’s ready to bring joy, companionship, and plenty of unforgettable moments to his future family."],
["Bella","Female","🎀","the_hotdogs_cl_20261012_120908_312.jpg","Meet Bella, a precious little Dachshund with an adorable face and a sweet, charming appearance. 🐶 She’s looking for a loving family ready to welcome her with care, attention, and plenty of cuddles."],
["Max","Male","🐾","the_hotdogs_cl_20261012_120909_969.jpg","Max is an adorable Dachshund puppy with a delightful personality and a curious little nature. ❤️ He’s ready to meet a responsible family that can provide a safe home, proper care, and a lifetime of companionship."],
["Daisy","Female","🌸","the_hotdogs_cl_20261012_120914_937.jpg","Say hello to Daisy, a lovely little Dachshund who is ready to brighten someone's days. 💕 With her adorable appearance and playful puppy charm, she could become a wonderful companion for a family prepared for puppy life."],
["Teddy","Male","🧸","","Meet Teddy, a lovable little Dachshund with a cute face and a personality waiting to blossom. 🐾 He deserves a family that will give him patience, affection, proper nutrition, and all the care he needs as he grows."],

["Charlie","Male","💙","","Charlie is a charming little Dachshund who is ready to start a new chapter with his future family. 🐾 He’ll need plenty of love, positive training, and a comfortable home where he can grow into a happy and well-cared-for companion."],
["Molly","Female","🌷","","Meet Molly, a delightful Dachshund puppy who deserves a family ready to make her part of their everyday life. ❤️ She’s at a wonderful age to begin bonding with her owners through gentle handling, playtime, and consistent training."],
["Duke","Male","👑","","Introducing Duke, a handsome Dachshund puppy with a big personality packed into a little body. 🐶 He’s looking for a responsible family that will give him the attention, safe environment, and consistent care every young puppy deserves."],
["Luna","Female","🌙","","Luna is a precious little Dachshund with a sweet appearance and a whole lot of charm. 💗 She’s looking for a loving family prepared to provide proper nutrition, veterinary care, gentle socialization, and a safe place to call home."],
["Oliver","Male","🐶","","Meet Oliver, an adorable Dachshund puppy ready to find a family that understands the joys and responsibilities of raising a young dog. 🐾 He deserves daily companionship, positive training, and plenty of opportunities to learn and grow."],
["Rosie","Female","🌹","","Rosie is a lovely Dachshund puppy looking for a family to share life's little adventures with. 💕 Her future owners should be ready to provide a loving environment, regular health checks, and the time and patience needed to help a puppy thrive."],
["Milo","Male","🤎","","Milo is a charming little Dachshund with an adorable look and a curious puppy spirit. 🐾 He’s looking for a family committed to giving him proper care, gentle guidance, safe playtime, and a lifetime of love and companionship."],
["Sophie","Female","🌼","","Say hello to Sophie, a sweet Dachshund puppy who could become a treasured member of the right family. ❤️ She deserves a safe and comfortable home, proper nutrition, regular veterinary attention, and plenty of positive experiences as she grows."],
["Bruno","Male","🐕","","Meet Bruno, a handsome little Dachshund who is ready to meet his prospective family. 🐶 With consistent routines, positive reinforcement, and responsible care, he can begin developing healthy habits and building a strong bond with his new owners."],
["Chloe","Female","🎀","","Chloe is an adorable Dachshund puppy with a sweet little face and lots of growing ahead of her. 💕 She’s looking for a responsible family that can provide affection, age-appropriate training, regular veterinary care, and a secure environment."],
["Cooper","Male","⭐","","Introducing Cooper, a delightful Dachshund puppy who deserves a home where he can feel safe, loved, and cared for. 🐾 His new family should be ready for daily companionship, patient house-training, and the commitment involved in raising a healthy puppy."],
["Ruby","Female","❤️","","Meet Ruby, a precious Dachshund puppy looking for a family that will cherish her and help her grow. 🌸 She needs a loving environment, a consistent routine, positive socialization, and proper veterinary care to support her development."],
["Archie","Male","🧡","","Archie is an adorable Dachshund puppy ready to be considered by a caring and responsible family. 🐾 His future owners should be prepared to offer proper nutrition, patient training, regular health checks, and lots of companionship throughout his life."],
["Penny","Female","🌺","","Meet Penny, a lovely little Dachshund who could be the perfect companion for a family prepared to welcome a puppy. 💗 She deserves patient guidance, a secure home, proper care, and plenty of affection as she settles into her new surroundings."]
];

const grid = document.getElementById("puppiesGrid");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(query="") {
 const list=puppies.map((p,i)=>({...{p,i}})).filter(x=>x.p[0].toLowerCase().includes(query.trim().toLowerCase()));
 document.getElementById("count").textContent=`Showing ${list.length} puppy profile${list.length===1?"":"s"}`;
 document.getElementById("noResults").style.display=list.length?"none":"block";
 grid.innerHTML=list.map(({p,i})=>`
 <article class="card">
 <div class="photo">
 <span class="photo-label">Puppy Profile ${String(i+1).padStart(2,"0")}</span>
 ${p[3]?`<img src="${esc(p[3])}" alt="${esc(p[0])}, Dachshund puppy" loading="lazy">`:""}
 <div class="placeholder" ${p[3]?'style="display:none"':""}><span>🐶</span><small>Puppy photo coming soon</small></div>
 </div>
 <div class="card-content">
 <div class="title-row"><div><h3>${p[2]} Meet ${esc(p[0])}</h3><div class="subtitle">Royal Dachshund Puppy</div></div><div class="price">$800</div></div>
 <div class="meta"><span>${p[1]==="Male"?"♂":"♀"} ${p[1]}</span><span>10 weeks old</span></div>
 <p class="description">${esc(p[4])}</p>
 <a class="btn gold ask" href="#contact" data-name="${esc(p[0])}">Ask About ${esc(p[0])} →</a>
 </div></article>`).join("");

 grid.querySelectorAll(".photo img").forEach(img=>{
 const fail=()=>{img.classList.add("broken");img.nextElementSibling.style.display="flex";};
 img.addEventListener("error",fail);
 img.addEventListener("click",()=>{
 if(img.classList.contains("broken"))return;
 document.getElementById("largeImage").src=img.src;
 document.getElementById("lightbox").classList.add("open");
 document.body.style.overflow="hidden";
 });
 if(img.complete&&img.naturalWidth===0)fail();
 });

 grid.querySelectorAll(".ask").forEach(a=>a.addEventListener("click",e=>{
 e.preventDefault();
 const name=a.dataset.name;
 const subject=encodeURIComponent("Inquiry about "+name+" - Royal Dachshund Puppies");
 const body=encodeURIComponent("Hello Royal Dachshund Puppies,\n\nI would like to learn more about "+name+". Please let me know the current availability and provide further details.\n\nThank you.");
 location.href="mailto:royaldachshundpuppies@yahoo.com?subject="+subject+"&body="+body;
 }));
}

document.getElementById("search").addEventListener("input",e=>render(e.target.value));
function closeViewer(){
 document.getElementById("lightbox").classList.remove("open");
 document.getElementById("largeImage").src="";
 document.body.style.overflow="";
}
document.getElementById("close").addEventListener("click",closeViewer);
document.getElementById("lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")closeViewer();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer();});
document.getElementById("year").textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
